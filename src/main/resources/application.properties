spring.application.name=foodreels-backend

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/FoodReels
spring.datasource.username=postgres
spring.datasource.password=20070310
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
# $env:JWT_SECRET="foodreels-super-secret-jwt-key-2026-change-this-key"

# ===============================
# Server
# ===============================
server.port=8080