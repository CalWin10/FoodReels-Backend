spring.application.name=foodreels-backend

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/FoodReels
spring.datasource.username=postgres
spring.datasource.password=20070310
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

security.jwt.secret=${JWT_SECRET}
# $env:JWT_SECRET="foodreels-super-secret-jwt-key-2026-change-this-key"

# ===============================
# Server
# ===============================
server.port=8080

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

spring.flyway.baseline-version=1

spring.flyway.validate-on-migrate=true

# ============================================================
# ACTUATOR / MONITORING
# ============================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true

management.health.readinessstate.enabled=true


# ============================================================
# APPLICATION INFORMATION
# ============================================================

management.info.env.enabled=true

info.app.name=FoodReels Backend
info.app.description=Food discovery, recommendation and ordering backend
info.app.version=${APP_VERSION:1.0.0}

# ============================================================
# OPENAPI / SWAGGER
# ============================================================

springdoc.api-docs.enabled=true

springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha